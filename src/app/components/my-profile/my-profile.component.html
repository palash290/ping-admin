<div class="ct_inner_header_bg mt-4 ct_px_30">
    <h4 class="ct_fs_24 ct_fw_600 mb-0 ct_black_text">Edit Profile</h4>
</div>
<div class="ct_px_30 mt-4 pb-4">
    <div class="container-fluid">
        <div class="col-md-12">
            <div class="ct_white_bg ct_py_50_px_40 ct_border_radius_10">
                <form [formGroup]="profileForm">
                    <div class="d-flex align-items-center gap-3 ct_flex_col_575">
                        <div class="ct_profile_img">
                            <img [src]="profileImg ? profileImg : 'img/no_pro.png'" alt="">
                            <label for="ct_profile_update">
                                <input type="file" class="d-none" id="ct_profile_update"
                                    (change)="onFileSelected($event)" accept="image/*">
                                <div class="ct_upload_icon">
                                    <img src="img/upload_icon.png" alt="">
                                </div>
                            </label>
                        </div>
                        <div>
                            <h4 class="ct_fs_20 ct_fw_600 mb-0 ">Sara William</h4>
                            <p class="ct_fs_14 ct_text_clr_4B5563 mb-0">sarawilliam029gmail.com</p>
                        </div>
                    </div>
                    <div class="mt-5 row">
                        <div class="col-lg-6">
                            <div class="form-group mb-4">
                                <label for="" class="mb-2 ct_text_clr_4B5563">Full Name</label>
                                <input type="text" class="form-control ct_input" placeholder="Enter Full Name"
                                    value="Jenny Jhonson" formControlName="name">
                                <div *ngIf="profileForm.controls['name'].invalid && profileForm.controls['name'].touched"
                                    class="err_msg">
                                    <div *ngIf="profileForm.controls['name'].errors?.['required']">Please enter
                                        your full name.</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group mb-4">
                                <label for="" class="mb-2 ct_text_clr_4B5563">Email Id (non-editable)</label>
                                <input type="email" class="form-control ct_input" placeholder="Enter Email Address"
                                    disabled value="jennyjhonsongmail.com">
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 d-flex justify-content-end gap-3 ct_flex_col_575">
                        <button class="ct_black_btn ct_h_48 ct_w_100_575">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
