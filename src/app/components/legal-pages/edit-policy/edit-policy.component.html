<div class="ct_inner_header_bg mt-4 ct_px_30 d-flex align-items-center justify-content-between gap-2">
    <h4 class="ct_fs_24 ct_fw_600 mb-0 ct_black_text mb-0"><a routerLink="/home/legal-pages" class="ct_back_icon"><i
                class="fa-solid fa-arrow-left-long"></i></a>Edit Privacy Policy</h4>
</div>
<div class="ct_px_30 mt-4 pb-4">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- <textarea name="" id="" class="form-control ct_input h-auto" rows="6"
                    placeholder="write here..."></textarea> -->

                <ckeditor [editor]="Editor" [config]="editorConfig" [(ngModel)]="content"
                    [ngModelOptions]="{standalone: true}">
                </ckeditor>

                <div class="mt-3 d-flex justify-content-end gap-3">
                    <button class="ct_outline_btn ct_h_48">Cancel</button>
                    <button class="ct_black_btn ct_h_48">Save Changes</button>
                </div>
            </div>
        </div>
    </div>
</div>
