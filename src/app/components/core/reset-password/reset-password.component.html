<div class="ct_login_header">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="ct_login_logo">
                    <img src="img/logo.svg" alt="">
                </div>
            </div>
        </div>
    </div>
</div>
<section class="ct_login_main">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-7 d-lg-block d-none">
                <div class="ct_login_left_content">
                    <h2 class="mb-3">Secure Admin Access</h2>
                    <p class="ct_fs_18 ct_text_op_6">Log in to manage platform activity while respecting end-to-end
                        privacy standards.</p>
                    <img src="img/login_shape.png" alt="">
                </div>
            </div>
            <div class="col-lg-5">
                <div class="ct_login_form_wrapper ct_box_shadow_1">
                    <h3 class="mb-2 ct_fs_32 text-center">Reset Password</h3>
                    <!-- <p class="ct_fs_14 ct_text_clr_96A0AD text-center">Don’t worry it happens, please enter the email
                        associated with your account.</p> -->
                    <form [formGroup]="Form" class="mt-5">
                        <div class="form-group mb-2">
                            <label for="password" class="mb-2 d-block">New Password</label>
                            <div class="position-relative">
                                <input type="{{ isPasswordVisible2 ? 'text' : 'password' }}"
                                    class="form-control ct_input" id="password" placeholder="Enter your password"
                                    formControlName="new_password">
                                <i class="fa-regular ct_show_eye"
                                    [ngClass]="isPasswordVisible2 ? 'fa-eye' : 'fa-eye-slash' "
                                    (click)="togglePasswordVisibility2()"></i>
                            </div>

                            <div class="ct_text_red"
                                *ngIf="Form.controls['new_password']?.invalid && Form.controls['new_password']?.touched">

                                <div *ngIf="Form.controls['new_password'].errors?.['required']; else checkMinLength">
                                    New password is required.
                                </div>

                                <ng-template #checkMinLength>
                                    <div *ngIf="Form.controls['new_password'].errors?.['minlength'];">
                                        New password must be at least 8 characters long.
                                    </div>
                                </ng-template>
                            </div>

                        </div>
                        <div class="form-group mb-2">
                            <label for="password" class="mb-2 d-block">Confirm Password</label>
                            <div class="position-relative">
                                <input type="{{ isPasswordVisible2 ? 'text' : 'password' }}"
                                    class="form-control ct_input" id="password" placeholder="Enter your password"
                                    formControlName="confirm_password">
                                <i class="fa-regular ct_show_eye"
                                    [ngClass]="isPasswordVisible3 ? 'fa-eye' : 'fa-eye-slash' "
                                    (click)="togglePasswordVisibility3()"></i>
                            </div>
                            <div *ngIf="Form.controls['confirm_password']?.invalid && Form.controls['confirm_password'].touched"
                                class="err_msg">
                                <div *ngIf="Form.controls['confirm_password'].errors?.['required']">
                                    Confirm password is required.</div>
                                <div
                                    *ngIf="passwordMismatch && !Form.controls['confirm_password'].errors?.['required']">
                                    Passwords do not match.</div>
                            </div>
                        </div>

                        <div routerLink="/" class="ct_mt_30">
                            <a class="ct_black_btn w-100">Submit</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
